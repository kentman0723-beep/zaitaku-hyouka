            width: 8px;

        }

            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 柔らかいカードスタイル */
        .glass {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        
        .glass:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -4px rgba(0, 0, 0, 0.02);
        }

        /* 入力フィールド */
        .input-field {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.625rem;
            background-color: #f8fafc;
            color: #334155;
            font-size: 0.875rem;
            line-height: 1.5;
            transition: all 0.2s ease;
        }

        .input-field:hover {
            border-color: #cbd5e1;
            background-color: #ffffff;
        }

        .input-field:focus {
            outline: none;
            border-color: #6366f1;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input-field::placeholder {
            color: #94a3b8;
        }

        /* ボタン */
        .btn {
            padding: 0.6rem 1.15rem;
            border-radius: 0.625rem;
            border: 1px solid transparent;
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.25rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn svg {
            width: 1rem;
            height: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: #ffffff;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
            box-shadow: 0 4px 8px rgba(79, 70, 229, 0.25);
            transform: translateY(-1px);
        }

        .btn-secondary,
        .btn-outline {
            background-color: #ffffff;
            color: #475569;
            border-color: #e2e8f0;
        }

        .btn-secondary:hover:not(:disabled),
        .btn-outline:hover:not(:disabled) {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: #1e293b;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            color: #ffffff;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
        }
        
        .btn-danger:hover:not(:disabled) {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
        }

        .btn-ghost {
            background-color: transparent;
            color: #64748b;
        }

        .btn-ghost:hover:not(:disabled) {
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* 柔らかいAIボタン */
        .btn-ai {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
            color: #4338ca;
            border: 1px solid #c7d2fe;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;

            cursor: pointer;
            box-shadow: 0 1px 2px rgba(99, 102, 241, 0.08);

        }

        .btn-ai svg {
            width: 0.875rem;
            height: 0.875rem;
            color: #4f46e5;
        }

        .btn-ai:hover:not(:disabled) {
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);

        .btn-ai:disabled {
            background: #f1f5f9;
            border-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;

        }

            font-size: 0.875rem;
            font-weight: 500;

        .nav-item:hover {

        .nav-item-active,

            font-weight: 600;
        }

        .nav-item-active svg {
            color: #4f46e5;

            font-size: 1.35rem;

            display: inline-block;
            width: 4px;
            height: 1.25rem;
            border-radius: 9999px;
            background: linear-gradient(to bottom, #6366f1, #3b82f6);
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.5rem;

            font-size: 0.8125rem;

            padding: 0.25rem 0.55rem;

            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: all 0.15s ease;
        }

        .link-action:hover {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #cbd5e1;
        }

        .link-danger {
            color: #ef4444;
            background-color: #fef2f2;
            border-color: #fee2e2;

        .link-danger:hover {
            background-color: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

  const parseMonthlyWorkTimeExcel = async (file, targetYear, targetMonth, currentUsers) => {
    if (!file) return null;
    let data;
    try {
      data = await file.arrayBuffer();
    } catch (e) {
      return { success: false, fileName: file.name, error: 'ファイルの読み込みに失敗しました' };
    }

    let workbook = null;
    // 1. 通常読み込み（xlsx または UTF-8 CSV）
    try {
      workbook = window.XLSX.read(new Uint8Array(data), { type: 'array' });
    } catch (e1) {
      // 2. Shift-JIS (CP932) で再試行（CSVの場合など）
      try {
        workbook = window.XLSX.read(new Uint8Array(data), { type: 'array', codepage: 932 });
      } catch (e2) {
        return { success: false, fileName: file.name, error: 'Excel/CSV形式として認識できませんでした: ' + (e2.message || String(e2)) };
      }
    }

    if (!workbook || !workbook.SheetNames || workbook.SheetNames.length === 0) {
      return { success: false, fileName: file.name, error: 'Excelファイル内にシートが見つかりません' };
    }

    let matchedSheet = null;
    let headerRowIdx = -1;
    let nameColIdx = -1;
    let numberColIdx = -1;
    let statusColIdx = -1;

    let textData = [];

    // 【第1フェーズ】全シート走査してヘッダー列名を探索
    for (const sName of workbook.SheetNames) {
      const ws = workbook.Sheets[sName];
      if (!ws) continue;
      const tData = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
      const rData = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      if (!tData || tData.length === 0) continue;

      for (let i = 0; i < Math.min(tData.length, 50); i++) {
        const row = tData[i];
        if (!Array.isArray(row)) continue;
        const nIdx = row.findIndex(c => {
          const s = String(c || '').replace(/[\s\u3000\u00A0\u200B\r\n\t]/g, '');
          return s.includes('利用者名') || s.includes('氏名') || s.includes('名前') || s.includes('対象者') || s.includes('利用者');
        });
        const numIdx = row.findIndex(c => {
          const s = String(c || '').replace(/[\s\u3000\u00A0\u200B\r\n\t]/g, '');
          return s.includes('受給者証') || s.includes('受給者番号') || s.includes('受給者') || s.includes('証番号') || s.includes('番号');
        });
        const sIdx = row.findIndex(c => {
          const s = String(c || '').replace(/[\s\u3000\u00A0\u200B\r\n\t]/g, '');
          return s.includes('サービス提供状況') || s.includes('提供状況') || s.includes('サービス') || s.includes('就労状況') || s.includes('区分') || s.includes('状況');
        });
        const dIdx = row.findIndex(c => {
          const s = String(c || '').replace(/[\s\u3000\u00A0\u200B\r\n\t]/g, '');
          return s === '日付' || s.includes('日付') || s === '日' || s.includes('利用日') || s.includes('作業日') || s.includes('年月日');

          matchedSheet = sName;
          headerRowIdx = i;
          nameColIdx = nIdx;
          numberColIdx = numIdx;
          statusColIdx = sIdx;
          dateColIdx = dIdx;
          textData = tData;
          rawData = rData;
          console.log(`✅ [ヘッダー検出] シート「${sName}」の${i+1}行目でヘッダー発見: 氏名(列${nIdx}), 日付(列${dIdx}), 状況(列${sIdx})`);

        const ws = workbook.Sheets[sName];

        const tData = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
        const rData = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
        if (!tData || tData.length < 2) continue;

        let maxCols = 0;
        for (let i = 0; i < Math.min(tData.length, 30); i++) {
          if (Array.isArray(tData[i])) maxCols = Math.max(maxCols, tData[i].length);
        }

        const colScores = [];
        for (let c = 0; c < maxCols; c++) {
          let nameScore = 0;
          let statusScore = 0;
          let dateScore = 0;
          let numberScore = 0;

          for (let r = 0; r < Math.min(tData.length, 60); r++) {
            const rawVal = rData[r] ? rData[r][c] : '';
            const textVal = String((tData[r] && tData[r][c]) || '').trim();
            const cleanText = textVal.replace(/[\s\u3000\u00A0\u200B\r\n\t]/g, '');
            if (!cleanText) continue;

            // 氏名スコア
            for (const u of currentUsers) {
              const uName = (u.name || '').replace(/[\s\u3000\u00A0]+/g, '');
              if (uName && (cleanText === uName || cleanText.includes(uName) || uName.includes(cleanText))) {
                nameScore += 10;
                break;
              }
            }
            if (cleanText.includes('利用者名') || cleanText.includes('氏名')) nameScore += 5;

            // 状況スコア
            if (cleanText.includes('施設外就労') || cleanText.includes('施設外') || cleanText.includes('通所') || cleanText.includes('在宅')) {
              statusScore += 10;
            }
            if (cleanText.includes('サービス提供状況') || cleanText.includes('提供状況')) statusScore += 5;

            // 日付スコア
            const num = Number(rawVal);
            if (!isNaN(num) && num > 35000 && num < 60000) dateScore += 10;
            if (/(?:(?:\d{2,4})[-/／])?\d{1,2}[-/／]\d{1,2}/.test(cleanText) || /\d{1,2}月\d{1,2}日/.test(cleanText)) dateScore += 10;
            if (cleanText === '日付' || cleanText.includes('日付')) dateScore += 5;

            // 番号スコア
            if (/^\d{8,12}$/.test(cleanText)) numberScore += 10;
          }
          colScores.push({ colIdx: c, nameScore, statusScore, dateScore, numberScore });
        }

        const bestName = [...colScores].sort((a, b) => b.nameScore - a.nameScore)[0];
        const bestStatus = [...colScores].sort((a, b) => b.statusScore - a.statusScore)[0];
        const bestDate = [...colScores].sort((a, b) => b.dateScore - a.dateScore)[0];
        const bestNumber = [...colScores].sort((a, b) => b.numberScore - a.numberScore)[0];

        if (bestName && bestName.nameScore >= 10 &&
            bestStatus && bestStatus.statusScore >= 10 &&
            bestDate && bestDate.dateScore >= 10) {
          matchedSheet = sName;
          nameColIdx = bestName.colIdx;
          statusColIdx = bestStatus.colIdx;
          dateColIdx = bestDate.colIdx;
          numberColIdx = (bestNumber && bestNumber.numberScore >= 10 && bestNumber.colIdx !== nameColIdx && bestNumber.colIdx !== dateColIdx && bestNumber.colIdx !== statusColIdx) ? bestNumber.colIdx : -1;
          headerRowIdx = 0; // 行全体からスキャン

        sheets: workbook.SheetNames
      };
    }

    // 行データの抽出
    const rows = [];
    let currentName = '';
    let currentNumber = '';
    for (let i = headerRowIdx + 1; i < textData.length; i++) {
      const tRow = textData[i] || [];
      const rRow = rawData[i] || [];
      if (!Array.isArray(tRow) || tRow.length === 0) continue;
      let cellName = String(tRow[nameColIdx] || '').trim();
      if (cellName && !cellName.includes('利用者名') && !cellName.includes('氏名')) currentName = cellName;
      let cellNum = numberColIdx !== -1 ? String(tRow[numberColIdx] || '').trim() : '';
      if (cellNum && !cellNum.includes('受給者')) currentNumber = cellNum;

      const statusVal = String(tRow[statusColIdx] || '').trim();
      const dateTextVal = String(tRow[dateColIdx] || '').trim();
      const dateRawVal = rRow[dateColIdx] !== undefined ? rRow[dateColIdx] : '';

      if (currentName || statusVal || dateTextVal) {
        rows.push({
          userName: currentName,
          userNumber: currentNumber,
          status: statusVal,
          dateText: dateTextVal,
          dateRaw: dateRawVal
        });
      }
    }

    // 日付パースヘルパー
    const parseExcelDate = (valRaw, valText) => {
      let m = -1, d = -1;
      const num = Number(valRaw);
      if (!isNaN(num) && num > 30000 && num < 60000) {
        if (window.XLSX && window.XLSX.SSF && window.XLSX.SSF.parse_date_code) {
          try {
            const parsed = window.XLSX.SSF.parse_date_code(num);
            if (parsed && parsed.d) {
              return { month: parsed.m, day: parsed.d };
            }
          } catch(e) {}
        }
        const dt = new Date(Math.round((num - 25569) * 86400 * 1000));
        m = dt.getUTCMonth() + 1;
        d = dt.getUTCDate();
        return { month: m, day: d };
      }
      const str = String(valText || valRaw || '')
        .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/[\s\u3000\u00A0]+/g, '');
      const slashMatch = str.match(/(?:(?:\d{2,4})[-/／])?(\d{1,2})[-/／](\d{1,2})/);
      if (slashMatch) {
        return { month: parseInt(slashMatch[1], 10), day: parseInt(slashMatch[2], 10) };
      }
      const jpMatch = str.match(/(?:(?:\d{2,4})年)?(\d{1,2})月(\d{1,2})日/);
      if (jpMatch) {
        return { month: parseInt(jpMatch[1], 10), day: parseInt(jpMatch[2], 10) };
      }
      return { month: m, day: d };
    };

    // 利用者照合ヘルパー
    const isMatchUser = (user, rName, rNum) => {

      const normRName = String(rName || '').replace(/[\s\u3000\u00A0]+/g, '');
      if (normUserName && normRName && (normUserName === normRName || normRName.includes(normUserName) || normUserName.includes(rName))) return true;

          userName: user.name,
          userNumber: user.number
        });
      }
    }

  const sanitizeSeasonalExpressions = text => {

  // --- 内蔵スマート評価文章生成エンジン（週評価データから月次達成度評価の全8項目を高精度合成） ---
  const generateLocalMonthlyEvaluation = (user, userRecords, year, month, userIndex = 0) => {
    const seedStr = `${user?.id || ''}_${user?.name || ''}_${year}_${month}_${userIndex}`;
    let seed = 2166136261;
    for (let i = 0; i < seedStr.length; i++) {
      seed ^= seedStr.charCodeAt(i);
      seed = Math.imul(seed, 16777619) >>> 0;
    }
    const pick = (arr, offset = 0) => {
      const h = (Math.imul(seed ^ (offset * 2654435761), 2246822519) >>> 0) + userIndex * 11 + offset * 5;
      return arr[h % arr.length];
    };

    const goalTexts = (userRecords || []).map(r => sanitizeSeasonalExpressions(r.goals || '').trim()).filter(Boolean);
    const workTexts = (userRecords || []).map(r => sanitizeSeasonalExpressions(r.workContent || '').trim()).filter(Boolean);
    const condTexts = (userRecords || []).map(r => sanitizeSeasonalExpressions(r.condition || '').trim()).filter(Boolean);

    // 週単位の表現を月単位の自然な表現に変換し、重複文を整理するヘルパー
    const extractUniqueSentences = (texts, mode) => {
      const seen = [];
      const result = [];
      for (const raw of texts) {
        const cleaned = raw
          .replace(/今週は、?|今週も、?|この1週間は、?|この１週間は、?|本週は、?/g, '')
          .replace(/(?:来週は、?|来週も、?|次週は、?|次週も、?)\s*(?:引き続き)?/g, '引き続き')
          .replace(/(引き続き)+/g, '引き続き')
          .replace(/来週に向けて|来週に向け/g, '今後に向けて')
          .replace(/今週の/g, '日々の')
          .replace(/1週間を通して|１週間を通して|1週間を通じて|１週間を通じて/g, '月間を通じて')
          .replace(/1週間の|１週間の/g, '日々の')
          .trim();
        const parts = cleaned.split(/[。\n]+/).map(s => s.trim()).filter(s => s.length >= 4);
        for (const p of parts) {
          const norm = p.replace(/[、,\s　]/g, '');
          const isDup = seen.some(existing => {
            if (existing === norm) return true;
            const shorter = existing.length < norm.length ? existing : norm;
            const longer = existing.length < norm.length ? norm : existing;
            if (shorter.length >= 10 && longer.includes(shorter.substring(0, Math.floor(shorter.length * 0.75)))) return true;
            return false;
          });
          if (!isDup) {
            seen.push(norm);
            result.push(p);
          }
        }
      }
      return result;
    };

    const goalSentences = extractUniqueSentences(goalTexts, 'goal');
    const workSentences = extractUniqueSentences(workTexts, 'work');
    const condSentences = extractUniqueSentences(condTexts, 'cond');
    const combinedText = [...goalTexts, ...workTexts, ...condTexts].join(' ');

  // --- 個別フィールド用キーワードからのローカル文章生成フォールバック ---
  const generateLocalFieldFromKeyword = (fieldKey, keywordText, userName = '') => {
    const cleanKw = sanitizeSeasonalExpressions(String(keywordText || '').trim()).replace(/[。\n]+$/g, '');
    if (!cleanKw) return '';
    if (fieldKey === 'condition') {
      return `今週は${cleanKw}とのことで、自身の体調に気を配りながら過ごすことができました。睡眠リズムや日々の健康管理も意識されており、無理のないペースで日中の活動に臨めています。`;
    }

      return `今週は在宅にて、${cleanKw}に取り組みました。指示された手順を確認しながら、自身のペースで丁寧かつ着実に作業を進めることができました。`;
    }

      return `今後は${cleanKw}ことを目標として取り組みます。引き続き体調管理を優先しながら、分からない点は早めに確認し安定した作業継続を目指します。`;
    }

    }
    if (fieldKey === 'improvementPlan') {

  // --- 全利用者の達成度評価を一括自動作成 ---
  const autoCreateAllMonthlyEvaluations = async () => {
    const year = monthlyFormData.targetYear;
    const month = monthlyFormData.targetMonth;

    // Excelファイル未添付の場合の安全確認
    if (!monthlyExcelFile) {
      const confirmNoExcel = confirm(`作業時間Excelファイルが選択されていません。\n全利用者の実施日をデフォルトの【${month}月15日】で作成しますか？\n\n（Excelファイルを添付すると、各利用者の15日以降の来所日・施設外就労日が自動設定されます）`);
      if (!confirmNoExcel) return;
    }

    setBulkCreating(true);
    setBulkCreateProgress('準備中...');
    try {
      let currentKey = (apiKey || MANUAL_API_KEY || localStorage.getItem('sw_api_key') || '').trim();
      let keySource = currentKey ? apiKey ? 'state' : MANUAL_API_KEY ? 'manual' : 'localStorage' : 'none';

      // Excelデータの解析結果を取得（プレビュー情報がある場合は再利用、なければ解析実行）
      let currentExcelInfo = null;
      if (monthlyExcelFile) {
        if (excelPreviewInfo && excelPreviewInfo.success && excelPreviewInfo.fileName === monthlyExcelFile.name) {
          currentExcelInfo = excelPreviewInfo;
        } else {
          currentExcelInfo = await parseMonthlyWorkTimeExcel(monthlyExcelFile, year, month, users);
          setExcelPreviewInfo(currentExcelInfo);
        }

        if (!currentExcelInfo || !currentExcelInfo.success) {
          alert(`Excelファイルの読み込みに失敗しました:\n${currentExcelInfo?.error || '列を検出できませんでした'}\n\n作成を中断します。ファイル内容をご確認ください。`);
          setBulkCreating(false);
          setBulkCreateProgress('');
          return;
        }
      }

      // APIキーがない場合、localStorageから取得を試みる
      if (!currentKey) {
        const savedKey = (localStorage.getItem('sw_api_key') || '').trim();
        if (savedKey) {
          currentKey = savedKey;
          keySource = 'localStorage';
          setApiKey(savedKey);
          console.log('APIキーをlocalStorageから取得しました');
        }
      }
      console.log(`APIキー状態: currentKey=${currentKey ? '有(' + currentKey.substring(0, 8) + '...)' : '無'}, source=${keySource}`);

      // 対象月の週評価データがある利用者を取得
      const usersWithRecords = users.filter(user => {
        return records.some(r => {
          if (r.userId !== user.id) return false;
          const d = new Date(r.implementationDate);
          return d.getFullYear() === year && d.getMonth() + 1 === month;
        });
      });
      if (usersWithRecords.length === 0) {
        alert(`${year}年${month}月の週評価データを持つ利用者がいません。`);
        setBulkCreating(false);
        setBulkCreateProgress('');
        return;
      }

      // 既存の評価との重複チェック
      const alreadyCreated = usersWithRecords.filter(user => savedMonthlyEvals.some(e => e.userId === user.id && e.targetYear === year && e.targetMonth === month));
      if (alreadyCreated.length > 0) {
        const names = alreadyCreated.map(u => u.name).join('、');
        if (!confirm(`以下の利用者は既に${month}月の達成度評価が作成済みです：\n${names}\n\n上書きしますか？`)) {
          setBulkCreating(false);
          setBulkCreateProgress('');
          return;
        }
      }

      let aiSuccessCount = 0;
      let localFallbackCount = 0;
      let workingModelName = null;
      let firstError = null;

          let generated = false;

              // 402(前払いクレジット残高不足) や 400/403(APIキー無効) は全モデル共通の致命的エラーのため即座にループ終了

                break;
              }
              if (errMsg.includes('429') || errMsg.includes('quota') || errMsg.includes('RESOURCE_EXHAUSTED') || errMsg.includes('404')) {
                rateLimitedModels.add(modelName);
              }
            }
          }

          // 2. SDK失敗時かつ致命的キーエラーでない場合のみ REST API 直接呼び出しを試行
          if (!generated && !fatalApiError) {

      const totalFields = aiSuccessCount + localFallbackCount;

  const mergeById = (cloudList, localList, deletedSet) => {
    const map = new Map();
    let localHasNew = false;
    (cloudList || []).forEach(item => {
      if (item && item.id && !deletedSet.has(item.id)) {
        map.set(item.id, item);
      }
    });
    (localList || []).forEach(item => {
      if (!item || !item.id || deletedSet.has(item.id)) return;
      if (!map.has(item.id)) {
        map.set(item.id, item);
        localHasNew = true;
      } else {
        const existing = map.get(item.id);
        const localTime = item.updatedAt ? new Date(item.updatedAt).getTime() : 0;
        const cloudTime = existing.updatedAt ? new Date(existing.updatedAt).getTime() : 0;
        if (localTime > cloudTime) {
          map.set(item.id, item);
          localHasNew = true;
        } else if ((!existing.furigana && item.furigana) || (!existing.number && item.number)) {
          map.set(item.id, { ...existing, ...item });
          localHasNew = true;
        }
      }
    });
    return { merged: Array.from(map.values()), localHasNew };

      console.log('💾 Supabaseに達成度評価保存:', evalData.id);
    } catch (e) {
      lastErr = e;
      console.warn('Supabase書き込み失敗(monthly_eval):', e);
    }
    if (!skipFollowUp) {
      const nextMonthly = monthlyRef.current.some(m => m.id === evalData.id)
        ? monthlyRef.current.map(m => m.id === evalData.id ? evalData : m)
        : [...monthlyRef.current, evalData];
      saveToGasCloud({ monthlyEvaluations: nextMonthly });
    }
    return { success: sbOk, error: lastErr };
  };

  const deleteMonthlyEvalFromSupabase = async evalId => {
    addDeletedId(evalId);
    addDeletedId('meval_' + evalId);
    try {
      await supabaseClient.from('records').delete().eq('id', 'meval_' + evalId);
      console.log('🗑️ Supabaseから達成度評価削除:', evalId);
    } catch (e) {
      console.warn('Supabase削除失敗(monthly_eval):', e);
    }
    const nextMonthly = monthlyRef.current.filter(m => m.id !== evalId);
    saveToGasCloud({ monthlyEvaluations: nextMonthly });
  };

  // --- データ読み込み（GASクラウド & Supabase 両対応・ローカルデータ自動マージ＆自動アップロード） ---
  const loadData = async () => {
    // 1. まずローカルデータを取得
    let localUsers = [];
    let localRecords = [];
    let localMonthly = [];
    try {
      let savedUsers = localStorage.getItem(lsKey('users'));
      let savedRecords = localStorage.getItem(lsKey('records'));
      let savedMonthly = localStorage.getItem(lsKey('monthly_evaluations'));
      if (accountId === 'ogura_kajimachi') {
        if (!savedUsers) savedUsers = localStorage.getItem('sw_users');
        if (!savedRecords) savedRecords = localStorage.getItem('sw_records');
        if (!savedMonthly) savedMonthly = localStorage.getItem('sw_monthly_evaluations');
      }
      localUsers = savedUsers ? JSON.parse(savedUsers) : [];
      localRecords = savedRecords ? JSON.parse(savedRecords) : [];
      localMonthly = savedMonthly ? JSON.parse(savedMonthly) : [];
    } catch (e) {
      console.warn('ローカルデータ解析警告:', e);
    }

    const deletedSet = new Set(getDeletedIds());
    let cloudUsers = [];
    let cloudRecords = [];
    let cloudMonthly = [];
    let cloudRecorders = null;
    let cloudManagers = null;
    let cloudApiKey = '';
    let cloudGasUrlFound = '';
    let cloudSheetGidFound = '';

    let gasConnected = false;
    let sbConnected = false;

    // 2. Googleスプレッドシート (GAS) からの読み込みを試行
    const gasRes = await loadFromGasCloud();
    if (gasRes && gasRes.success) {
      gasConnected = true;
      if (gasRes.exists && gasRes.payload) {
        const p = gasRes.payload;
        if (Array.isArray(p.deletedIds)) {
          p.deletedIds.forEach(id => {
            deletedSet.add(id);
            addDeletedId(id);
          });
        }
        if (Array.isArray(p.users)) cloudUsers = [...cloudUsers, ...p.users];
        if (Array.isArray(p.records)) cloudRecords = [...cloudRecords, ...p.records];
        if (Array.isArray(p.monthlyEvaluations)) cloudMonthly = [...cloudMonthly, ...p.monthlyEvaluations];
        if (Array.isArray(p.recorderList) && p.recorderList.length > 0) cloudRecorders = p.recorderList;
        if (Array.isArray(p.managerList) && p.managerList.length > 0) cloudManagers = p.managerList;
        if (p.apiKey) cloudApiKey = p.apiKey;
      }
    }

    // 3. Supabase からの読み込みを試行（account_idカラム不在エラーを防ぐため全件取得してJS側でフィルタ）
    try {
      const { data: usersData, error: usersError } = await supabaseClient.from('users').select('*');
      if (usersError) throw usersError;
      const { data: recordsData, error: recordsError } = await supabaseClient.from('records').select('*');
      if (recordsError) throw recordsError;

      sbConnected = true;

      // メタデータ行の解析
      let accountMeta = null;
      const otherAccountUserIds = new Set();

      (usersData || []).forEach(u => {
        if (String(u.id).startsWith('__meta_')) {
          const acc = String(u.id).replace('__meta_', '');
          try {
            const parsed = JSON.parse(u.number || '{}');
            if (acc === accountId) {
              accountMeta = parsed;
            } else if (Array.isArray(parsed.userIds)) {
              parsed.userIds.forEach(uid => otherAccountUserIds.add(uid));
            }
          } catch (e) {}
        }
      });

      (recordsData || []).forEach(r => {
        if (String(r.id).startsWith('__meta_rec_') || r.methods?._type === 'account_meta') {
          const acc = r.methods?._accountId || String(r.id).replace('__meta_rec_', '');
          if (acc === accountId && r.methods) {
            accountMeta = { ...(accountMeta || {}), ...r.methods };
          } else if (Array.isArray(r.methods?.userIds)) {
            r.methods.userIds.forEach(uid => otherAccountUserIds.add(uid));
          }
        }
      });

      if (accountMeta) {
        if (Array.isArray(accountMeta.deletedIds)) {
          accountMeta.deletedIds.forEach(id => {
            deletedSet.add(id);
            addDeletedId(id);
          });
        }
        if (!cloudRecorders && Array.isArray(accountMeta.recorderList) && accountMeta.recorderList.length > 0) {
          cloudRecorders = accountMeta.recorderList;
        }
        if (!cloudManagers && Array.isArray(accountMeta.managerList) && accountMeta.managerList.length > 0) {
          cloudManagers = accountMeta.managerList;
        }
        if (!cloudApiKey && accountMeta.apiKey) cloudApiKey = accountMeta.apiKey;
        if (accountMeta.gasUrl) cloudGasUrlFound = accountMeta.gasUrl;
        if (accountMeta.sheetGid) cloudSheetGidFound = accountMeta.sheetGid;
      }

      const metaUserIdsSet = accountMeta && Array.isArray(accountMeta.userIds) ? new Set(accountMeta.userIds) : null;
      const furiganaMap = (accountMeta && accountMeta.furiganaMap) || {};

      const sbUsers = [];
      (usersData || []).forEach(u => {
        if (!u || !u.id || String(u.id).startsWith('__meta_') || u.name === '__META__') return;
        let belongs = false;
        if (u.account_id) {
          belongs = u.account_id === accountId;
        } else if (metaUserIdsSet && metaUserIdsSet.has(u.id)) {
          belongs = true;
        } else if (accountId === 'ogura_kajimachi' && !otherAccountUserIds.has(u.id)) {
          belongs = true;
        }
        if (belongs) {
          sbUsers.push({
            id: u.id,
            name: u.name,
            furigana: u.furigana || furiganaMap[u.id] || '',
            number: u.number || ''
          });
        }
      });

      const sbUserIdsSet = new Set(sbUsers.map(u => u.id));
      const extractMethod = r => {
        if (r.selected_method) return r.selected_method;
        if (r.methods && typeof r.methods === 'object') {
          if (r.methods._selectedMethod) return r.methods._selectedMethod;
          const keys = Object.keys(r.methods).filter(k => !k.startsWith('_') && r.methods[k]);
          if (keys.length > 0) return keys[0];
        }
        return 'commute';
      };

      const sbRecords = [];
      const sbMonthly = [];

      (recordsData || []).forEach(r => {
        if (!r || !r.id || String(r.id).startsWith('__meta_') || r.condition === '__META__' || r.methods?._type === 'account_meta') return;

        // 月次達成度評価レコードの抽出
        if (String(r.id).startsWith('meval_') || r.condition === '__MONTHLY_EVAL__' || r.methods?._type === 'monthly_evaluation') {
          const recAcc = r.account_id || r.methods?._accountId || (sbUserIdsSet.has(r.user_id) ? accountId : 'ogura_kajimachi');
          if (recAcc === accountId && r.methods?._payload) {
            sbMonthly.push(r.methods._payload);
          }
          return;
        }

        // 週評価レコードの抽出
        const recAcc = r.account_id || r.methods?._accountId || (sbUserIdsSet.has(r.user_id) ? accountId : ( otherAccountUserIds.has(r.user_id) ? '__other__' : 'ogura_kajimachi'));
        if (recAcc === accountId) {
          sbRecords.push({
            id: r.id,
            userId: r.user_id,
            implementationDate: r.implementation_date,
            previousDate: r.previous_date,
            periodStart: r.period_start,
            periodEnd: r.period_end,
            selectedMethod: extractMethod(r),
            condition: r.condition || '',
            workContent: r.work_content || '',
            goals: r.goals || '',
            recorder: r.recorder || '',
            manager: r.manager || '近藤恵子'
          });
        }
      });

      cloudUsers = mergeById(cloudUsers, sbUsers, deletedSet).merged;
      cloudRecords = mergeById(cloudRecords, sbRecords, deletedSet).merged;
      cloudMonthly = mergeById(cloudMonthly, sbMonthly, deletedSet).merged;
    } catch (sbErr) {
      console.warn('Supabase接続/読込スキップ:', sbErr);
    }

    // もしSupabaseからGASのURLが発見され、かつローカルに未設定だった場合は自動設定してGASからも読込
    if (cloudGasUrlFound && !localStorage.getItem('knowbe_gas_url')) {
      localStorage.setItem('knowbe_gas_url', cloudGasUrlFound);
      setCloudGasUrl(cloudGasUrlFound);
      if (cloudSheetGidFound && !localStorage.getItem('knowbe_sheet_gid')) {
        localStorage.setItem('knowbe_sheet_gid', cloudSheetGidFound);
      }
      const retryGas = await loadFromGasCloud();
      if (retryGas && retryGas.success) {
        gasConnected = true;
        if (retryGas.exists && retryGas.payload) {
          const p = retryGas.payload;
          cloudUsers = mergeById(cloudUsers, p.users || [], deletedSet).merged;
          cloudRecords = mergeById(cloudRecords, p.records || [], deletedSet).merged;
          cloudMonthly = mergeById(cloudMonthly, p.monthlyEvaluations || [], deletedSet).merged;
        }
      }
    }

    // 4. クラウドデータとローカルデータを統合（どちらのデータも消えないようにマージ）
    const mergedUsersResult = mergeById(cloudUsers, localUsers, deletedSet);
    const mergedRecordsResult = mergeById(cloudRecords, localRecords, deletedSet);
    const mergedMonthlyResult = mergeById(cloudMonthly, localMonthly, deletedSet);

    const finalUsers = mergedUsersResult.merged;
    const finalRecords = mergedRecordsResult.merged.sort((a, b) => new Date(b.implementationDate || 0) - new Date(a.implementationDate || 0));

    // AIエラー(402等)で課題・改善方針・健康面・妥当性が空白のまま保存された月次評価を自動修復
    let repairedMonthlyCount = 0;
    const finalMonthly = mergedMonthlyResult.merged.map((ev, idx) => {
      if (!ev.issues || !ev.improvementPlan || !ev.healthNotes || !ev.workValidity) {
        const u = finalUsers.find(usr => usr.id === ev.userId) || { id: ev.userId, name: '利用者' };
        const uRecs = finalRecords.filter(r => {
          if (r.userId !== ev.userId) return false;
          const d = new Date(r.implementationDate);
          return d.getFullYear() === Number(ev.targetYear) && d.getMonth() + 1 === Number(ev.targetMonth);
        }).sort((a, b) => new Date(a.implementationDate) - new Date(b.implementationDate));
        const localGen = generateLocalMonthlyEvaluation(u, uRecs, Number(ev.targetYear), Number(ev.targetMonth), idx);
        const wasAllBlank = !ev.issues && !ev.improvementPlan && !ev.healthNotes && !ev.workValidity;
        repairedMonthlyCount++;
        return {
          ...ev,
          trainingGoal: wasAllBlank ? localGen.trainingGoal : (ev.trainingGoal || localGen.trainingGoal),
          activities: wasAllBlank ? localGen.activities : (ev.activities || localGen.activities),
          achievement: wasAllBlank ? localGen.achievement : (ev.achievement || localGen.achievement),
          issues: ev.issues || localGen.issues,
          improvementPlan: ev.improvementPlan || localGen.improvementPlan,
          healthNotes: ev.healthNotes || localGen.healthNotes,
          otherNotes: ev.otherNotes || localGen.otherNotes,
          workValidity: ev.workValidity || localGen.workValidity,
          updatedAt: new Date().toISOString()
        };
      }
      return ev;
    });
    if (repairedMonthlyCount > 0) {
      console.log(`🔧 空白項目のある達成度評価 ${repairedMonthlyCount}件 を内蔵スマートエンジンで自動補完しました`);
    }

    setUsers(finalUsers);
    setRecords(finalRecords);
    setSavedMonthlyEvals(finalMonthly);
    localStorage.setItem(lsKey('users'), JSON.stringify(finalUsers));
    localStorage.setItem(lsKey('records'), JSON.stringify(finalRecords));
    localStorage.setItem(lsKey('monthly_evaluations'), JSON.stringify(finalMonthly));

    if (cloudRecorders && (!localStorage.getItem(lsKey('recorder_list')) || recorderList.length === 0)) {
      setRecorderList(cloudRecorders);
      localStorage.setItem(lsKey('recorder_list'), JSON.stringify(cloudRecorders));
    }
    if (cloudManagers && (!localStorage.getItem(lsKey('manager_list')) || managerList.length === 0)) {
      setManagerList(cloudManagers);
      localStorage.setItem(lsKey('manager_list'), JSON.stringify(cloudManagers));
    }
    if (cloudApiKey && !localStorage.getItem('sw_api_key') && localStorage.getItem('sw_api_key_cleared') !== '1') {
      setApiKey(cloudApiKey);
      localStorage.setItem('sw_api_key', cloudApiKey);
    }

    initialLoadDoneRef.current = true;

    // 5. 接続ステータスの更新と、ローカル未同期データの自動クラウドアップロード
    if (gasConnected || sbConnected) {
      setSupabaseStatus('connected');
      const activeNames = [gasConnected ? 'Googleスプレッドシート(GAS)' : '', sbConnected ? 'Supabase' : ''].filter(Boolean).join(' + ');
      setCloudStatusDetail(`クラウド同期有効 (${activeNames})`);
      setLastSyncedAt(new Date().toLocaleTimeString('ja-JP'));

      const hasUnsyncedLocal = repairedMonthlyCount > 0 || mergedUsersResult.localHasNew || mergedRecordsResult.localHasNew || mergedMonthlyResult.localHasNew ||
        (finalUsers.length > cloudUsers.length) || (finalRecords.length > cloudRecords.length) || (finalMonthly.length > cloudMonthly.length);

      if (hasUnsyncedLocal) {
        console.log('🔄 ローカルの未同期データをクラウドへ自動アップロードします...');
        if (gasConnected) {
          saveToGasCloud({
            users: finalUsers,
            records: finalRecords,
            monthlyEvaluations: finalMonthly
          });
        }
        if (sbConnected) {
          (async () => {
            await saveAccountMetaToSupabase({ users: finalUsers });
            for (const u of finalUsers) {
              if (!cloudUsers.some(cu => cu.id === u.id && cu.name === u.name && cu.furigana === u.furigana && cu.number === u.number)) {
                await saveUserToSupabase(u, true);
              }
            }
            for (const r of finalRecords) {
              if (!cloudRecords.some(cr => cr.id === r.id)) {
                await saveRecordToSupabase(r, true);
              }
            }
            for (const m of finalMonthly) {
              if (!cloudMonthly.some(cm => cm.id === m.id && cm.updatedAt === m.updatedAt)) {
                await saveMonthlyEvalToSupabase(m, true);
              }
            }
          })();
        }
      }
      console.log(`✅ アカウント[${accountName}(${accountId})] 同期完了（利用者: ${finalUsers.length}名、週評価: ${finalRecords.length}件、達成度: ${finalMonthly.length}件）`);
    } else {
      const hasGasUrl = !!(localStorage.getItem('knowbe_gas_url') || '').trim();
      setSupabaseStatus(hasGasUrl ? 'error' : 'local');
      setCloudStatusDetail(hasGasUrl ? 'クラウド接続エラー（ローカル保存中）' : 'このPCのブラウザのみ保存（クラウド未接続）');
      console.log(`ℹ️ ローカルモード[${accountName}(${accountId})]: 利用者 ${finalUsers.length}名, 週評価 ${finalRecords.length}件, 達成度 ${finalMonthly.length}件`);
    }
  };

  // 全データ一括アップロード（現在のローカルデータを GAS & Supabase へ同期）
  const [syncingAll, setSyncingAll] = useState(false);
  const syncAllLocalDataToSupabase = async () => {
    setSyncingAll(true);
    try {
      const gasRes = await saveToGasCloud({
        users,
        records,
        monthlyEvaluations: savedMonthlyEvals,
        recorderList,
        managerList,
        apiKey
      });

      let sbUserOk = 0;
      let sbRecOk = 0;
      let sbMonOk = 0;
      let sbFailed = false;
      let sbErrMsg = '';

      const metaRes = await saveAccountMetaToSupabase({ users, recorderList, managerList });
      if (!metaRes.success && users.length === 0 && records.length === 0 && savedMonthlyEvals.length === 0) {
        sbFailed = true;
        sbErrMsg = metaRes.error || '接続失敗';
      }

      for (const u of users) {
        const res = await saveUserToSupabase(u, true);
        if (res.success) sbUserOk++;
        else {
          sbFailed = true;
          if (!sbErrMsg && res.error) sbErrMsg = res.error.message || String(res.error);
        }
      }
      for (const r of records) {
        const res = await saveRecordToSupabase(r, true);
        if (res.success) sbRecOk++;
        else {
          sbFailed = true;
          if (!sbErrMsg && res.error) sbErrMsg = res.error.message || String(res.error);
        }
      }
      for (const m of savedMonthlyEvals) {
        const res = await saveMonthlyEvalToSupabase(m, true);
        if (res.success) sbMonOk++;
        else {
          sbFailed = true;
          if (!sbErrMsg && res.error) sbErrMsg = res.error.message || String(res.error);
        }
      }

      const sbSuccess = !sbFailed && (metaRes.success || sbUserOk > 0 || sbRecOk > 0 || sbMonOk > 0);
      if (gasRes.success || sbSuccess) {
        setSupabaseStatus('connected');
        const targets = [gasRes.success ? 'Googleスプレッドシート(GAS)' : '', sbSuccess ? 'Supabase' : ''].filter(Boolean).join(' / ');
        setCloudStatusDetail(`クラウド同期有効 (${targets})`);
        setLastSyncedAt(new Date().toLocaleTimeString('ja-JP'));
        alert(`クラウドへのデータ同期が完了しました！\n（保存先: ${targets}）\n\n・利用者: ${users.length}名\n・週評価: ${records.length}件\n・達成度評価: ${savedMonthlyEvals.length}件\n\n他のPCでも同じデータを閲覧・編集できます。`);
      } else {
        setSupabaseStatus('error');
        alert(`クラウドサーバーへの接続に失敗しました。\n\n【原因】\n・Supabaseサーバーが一時停止中（Failed to fetch）、または\n・Googleスプレッドシート連携（GAS URL）が未設定です。\n\n【他のPCで見れるようにする方法】\n① 下の「Googleスプレッドシート (GAS) クラウド同期」にGASのウェブアプリURLを設定するか、\n② 下の「全データをファイルに保存（書き出し）」ボタンでバックアップファイルを保存し、別のPCで「ファイルからデータを復元（読み込み）」してください。`);
      }
    } catch (err) {
      console.error('一括同期エラー:', err);
      alert('同期中にエラーが発生しました: ' + err.message);
    } finally {
      setSyncingAll(false);
    }
  };

  // --- ファイル書き出し（エクスポート）＆読み込み（インポート）機能 ---
  const exportAllDataJson = () => {
    try {
      const allStorage = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && (k.startsWith('sw_') || k.startsWith('knowbe_'))) {
          allStorage[k] = localStorage.getItem(k);
        }
      }
      const backupObj = {
        version: '2.6.0',
        exportedAt: new Date().toISOString(),
        currentAccountId: accountId,
        currentAccountName: accountName,
        accountData: {
          users,
          records,
          monthlyEvaluations: savedMonthlyEvals,
          recorderList,
          managerList
        },
        allStorage
      };
      const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().split('T')[0];
      a.href = url;
      a.download = `在宅評価データバックアップ_${accountName || accountId}_${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      alert('書き出しに失敗しました: ' + e.message);
    }
  };

  const importAllDataJson = file => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed || typeof parsed !== 'object') {
          throw new Error('有効なバックアップファイルではありません');
        }

        // allStorage が含まれている場合は全アカウント分の localStorage キーも復元
        if (parsed.allStorage && typeof parsed.allStorage === 'object') {
          Object.entries(parsed.allStorage).forEach(([k, v]) => {
            if ((k.startsWith('sw_') || k.startsWith('knowbe_')) && k !== 'sw_local_session' && typeof v === 'string') {
              localStorage.setItem(k, v);
            }
          });
        }

        const deletedSet = new Set();
        localStorage.removeItem(lsKey('deleted_ids'));

        // 現在のアカウント用のデータを取得・マージ
        let importedUsers = parsed.accountData?.users || parsed.users || [];
        let importedRecords = parsed.accountData?.records || parsed.records || [];
        let importedMonthly = parsed.accountData?.monthlyEvaluations || parsed.monthly_evaluations || [];

        if (parsed.allStorage && parsed.currentAccountId && parsed.currentAccountId !== accountId) {
          // 別アカウントで出力されたファイルでも現在のアカウントのキーがあればそちらを優先
          try {
            if (parsed.allStorage[lsKey('users')]) importedUsers = JSON.parse(parsed.allStorage[lsKey('users')]);
            if (parsed.allStorage[lsKey('records')]) importedRecords = JSON.parse(parsed.allStorage[lsKey('records')]);
            if (parsed.allStorage[lsKey('monthly_evaluations')]) importedMonthly = JSON.parse(parsed.allStorage[lsKey('monthly_evaluations')]);
          } catch (err) {}
        }

        const nextUsers = mergeById(importedUsers, users, deletedSet).merged;
        const nextRecords = mergeById(importedRecords, records, deletedSet).merged.sort((a, b) => new Date(b.implementationDate || 0) - new Date(a.implementationDate || 0));
        const nextMonthly = mergeById(importedMonthly, savedMonthlyEvals, deletedSet).merged;

        setUsers(nextUsers);
        setRecords(nextRecords);
        setSavedMonthlyEvals(nextMonthly);
        localStorage.setItem(lsKey('users'), JSON.stringify(nextUsers));
        localStorage.setItem(lsKey('records'), JSON.stringify(nextRecords));
        localStorage.setItem(lsKey('monthly_evaluations'), JSON.stringify(nextMonthly));

        if (Array.isArray(parsed.accountData?.recorderList) && parsed.accountData.recorderList.length > 0) {
          setRecorderList(parsed.accountData.recorderList);
          localStorage.setItem(lsKey('recorder_list'), JSON.stringify(parsed.accountData.recorderList));
        }
        if (Array.isArray(parsed.accountData?.managerList) && parsed.accountData.managerList.length > 0) {
          setManagerList(parsed.accountData.managerList);
          localStorage.setItem(lsKey('manager_list'), JSON.stringify(parsed.accountData.managerList));
        }
        if (localStorage.getItem('knowbe_gas_url')) {
          setCloudGasUrl(localStorage.getItem('knowbe_gas_url'));
        }
        if (localStorage.getItem('sw_api_key')) {
          setApiKey(localStorage.getItem('sw_api_key'));
        }

        // クラウドへも自動反映
        saveToGasCloud({
          users: nextUsers,
          records: nextRecords,
          monthlyEvaluations: nextMonthly
        });
        saveAccountMetaToSupabase({ users: nextUsers });

const UsageSummaryIntegration = ({ onGasConfigSaved }) => {
  const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('knowbe_gas_url') || '');
  const [sheetGid, setSheetGid] = useState(() => localStorage.getItem('knowbe_sheet_gid') || '1460989765');
  const [spreadsheetUrl] = useState('https://docs.google.com/spreadsheets/d/1i9Cn8Ay4qROo_WwZK4UCA-gGP0A-xLwSZ0PAtUA6DWE/edit?gid=1460989765#gid=1460989765');
  const [showConfig, setShowConfig] = useState(() => !localStorage.getItem('knowbe_gas_url'));

  const [targetYear, setTargetYear] = useState(() => new Date().getFullYear());
  const [targetMonth, setTargetMonth] = useState(() => new Date().getMonth() + 1);
  const [clearMissing, setClearMissing] = useState(true);

  const [isDragging, setIsDragging] = useState(false);
  const [fileName, setFileName] = useState('');
  const [parsedData, setParsedData] = useState(null);
  const [searchTerm, setSearchTerm] = useState('');

  const [isSyncing, setIsSyncing] = useState(false);
  const [syncStatus, setSyncStatus] = useState(null);

  const handleSaveConfig = () => {
    const trimmedUrl = gasUrl.trim();
    localStorage.setItem('knowbe_gas_url', trimmedUrl);
    localStorage.setItem('knowbe_sheet_gid', sheetGid.trim());
    if (onGasConfigSaved) onGasConfigSaved(trimmedUrl);
    alert('Google連携設定を保存しました。');
    if (trimmedUrl) setShowConfig(false);
  };

  const processFile = (file) => {
    if (!file) return;
    setFileName(file.name);
    setSyncStatus(null);

    const isExcel = file.name.endsWith('.xlsx') || file.name.endsWith('.xls');
    const reader = new FileReader();

    if (isExcel) {
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const csvText = XLSX.utils.sheet_to_csv(firstSheet);
          parseCSV(csvText);
        } catch (err) {
          alert('Excelファイルの読み込みに失敗しました: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = (e) => {
        try {
          parseCSV(e.target.result);
        } catch (err) {
          alert('CSVファイルの読み込みに失敗しました: ' + err.message);
        }
      };
      reader.readAsText(file, 'utf-8');
    }
  };

  const parseCSV = (csvText) => {
    const lines = csvText.split(/\r?\n/);
    let inDetailSection = false;
    const usersMap = {};
    let detectedMonth = null;
    let detectedYear = null;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;

      if (line.includes('<利用者毎の詳細情報>')) {
        inDetailSection = true;
        continue;
      }
      if (inDetailSection && (line.startsWith('<利用者毎のサービス提供状況ごとの集計') || line.startsWith('<利用者毎のサービス提供状況ごとのサマリ集計'))) {
        inDetailSection = false;
        break;
      }

      if (!inDetailSection && line.includes('利用者名') && line.includes('受給者証番号') && line.includes('日付')) {
        inDetailSection = true;
        continue;
      }

      if (inDetailSection) {
        if (line.startsWith('※')) continue;
        const cols = line.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
        if (cols[0] === '利用者名') continue;

        if (cols.length >= 8 && cols[0]) {
          const name = cols[0];
          const userNumber = cols[1] || '';
          const dateStr = cols[2] || '';
          const serviceStatus = cols[3] || '';
          const meal = cols[6] || '';
          const startTime = cols[7] || cols[4] || '';
          const endTime = cols[8] || cols[5] || '';

          const mMatch = dateStr.match(/(?:(\d{4})[\/-])?(\d{1,2})[\/-](\d{1,2})/);
          if (!mMatch) continue;

          if (mMatch[1]) detectedYear = parseInt(mMatch[1], 10);
          const mMonth = parseInt(mMatch[2], 10);
          const mDay = parseInt(mMatch[3], 10);
          if (!detectedMonth) detectedMonth = mMonth;

          let baseStatus = '';
          if (serviceStatus.includes('施設外就労')) {
            baseStatus = '外通';
          } else if (serviceStatus.includes('通所')) {
            baseStatus = '内在';
          }
          if (!baseStatus) continue;

          let timeSuffix = '';
          const toMin = (t) => {
            if (!t || !t.includes(':')) return null;
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
          };
          const sMin = toMin(startTime);
          const eMin = toMin(endTime);

          if (sMin !== null && eMin !== null) {
            if (eMin <= 750) {
              timeSuffix = ' AM';
            } else if (sMin >= 720) {
              timeSuffix = ' PM';
            }
          }

          const statusBadge = `${baseStatus}${timeSuffix}`;
          const mealBadge = meal === 'あり' ? '○' : '';

          if (!usersMap[name]) {
            usersMap[name] = {
              name,
              userNumber,
              records: {},
              totalDays: 0,
              totalMeal: 0
            };
          }

          usersMap[name].records[mDay] = {
            status: statusBadge,
            meal: mealBadge,
            startTime,
            endTime,
            rawStatus: serviceStatus
          };
          usersMap[name].totalDays++;
          if (mealBadge === '○') usersMap[name].totalMeal++;
        }
      }
    }

    const userList = Object.values(usersMap);
    if (userList.length === 0) {
      alert('作業時間データから利用者レコードを検出できませんでした。');
      return;
    }

    if (detectedMonth) setTargetMonth(detectedMonth);
    if (detectedYear) setTargetYear(detectedYear);

    const totalDays = userList.reduce((acc, u) => acc + u.totalDays, 0);
    const totalMeal = userList.reduce((acc, u) => acc + u.totalMeal, 0);

        totalDays,

      setShowConfig(true);
      return;
    }
    if (!parsedData || parsedData.users.length === 0) {
      alert('反映するデータがありません。先にファイルを添付してください。');
      return;
    }

    if (!confirm(`【${targetYear}年${targetMonth}月】の利用集計スプレッドシートに、${parsedData.users.length}名の実績データを反映します。よろしいですか？`)) {
      return;
    }

    setIsSyncing(true);
    setSyncStatus(null);

    const payload = {
      sheetGid: sheetGid.trim() || '1460989765',
      targetYear,
      targetMonth,
      clearMissingDays: clearMissing,
      users: parsedData.users.map(u => ({
        name: u.name,
        records: u.records
      }))
    };

    try {
      const response = await fetch(gasUrl.trim(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.success) {
        setSyncStatus({
          type: 'success',
          message: `スプレッドシートへの反映が完了しました！（${result.updatedUsers}名の利用者を更新）`,
          details: result
        });
      } else {
        setSyncStatus({
          type: 'error',
          message: `スプレッドシートの更新でエラーが発生しました: ${result.error || '不明なエラー'}`,
          details: result
        });
      }
    } catch (err) {
      setSyncStatus({
        type: 'error',
        message: `通信エラー: GASとの接続に失敗しました。URLとデプロイ設定をご確認ください。（${err.message}）`

      csv += `,${d}日実績,${d}日食数`;
    }
    csv += '\r\n';

    parsedData.users.forEach(u => {
